name: Daily NEPSE OHLC update

on:
  workflow_dispatch:
  schedule:
    # 12:30 UTC = 18:15 Nepal time; NEPSE trading days are Sunday–Thursday.
    - cron: "30 12 * * 0-4"

permissions:
  contents: write

concurrency:
  group: daily-nepse-update
  cancel-in-progress: false

jobs:
  update-nepse-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install scraper dependencies
        run: python -m pip install --upgrade -r requirements.txt

      - name: Fetch and validate NEPSE data
        run: python scripts/update_nepse.py --min-symbols 100

      - name: Commit repository data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "data: update NEPSE OHLC $(date -u +%F)"
          git push
